<style>
.Calculator .sfg-calc-wrap {
  font-family: 'Inter', sans-serif;
  max-width: 680px;
  margin: 40px auto;
  background: #ffffff;
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(7,48,75,0.12);
  overflow: hidden;
}
.Calculator .sfg-calc-header {
  background: linear-gradient(135deg, #07304b, #0d4a73);
  padding: 32px 40px;
  text-align: center;
}
.Calculator .sfg-calc-header h2 {
  color: #ffffff; font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: 0.3px;
}
.Calculator .sfg-calc-header p { color: rgba(255,255,255,0.7); font-size: 14px; margin: 0; }
.Calculator .sfg-calc-body { padding: 36px 40px; }
.Calculator .sfg-field {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 16px;
}
.Calculator .sfg-field label { color: #07304b; font-size: 15px; font-weight: 500; flex: 1; }
.Calculator .sfg-input-wrap {
  display: flex; align-items: center; border: 1.5px solid #dde4ea; border-radius: 8px;
  overflow: hidden; background: #f7f9fb; transition: border-color .2s;
}
.Calculator .sfg-input-wrap:focus-within { border-color: #ffd166; background: #fff; }
.Calculator .sfg-prefix { padding: 10px 10px 10px 14px; color: #07304b; font-weight: 600; font-size: 15px; }
.Calculator .sfg-input-wrap input,
.Calculator .sfg-input-wrap select {
  border: none !important; outline: none !important; background: transparent;
  padding: 10px 12px; font-size: 15px; color: #07304b; font-weight: 600; width: 110px;
}
.Calculator .sfg-input-wrap select { width: 130px; cursor: pointer; }
.Calculator .sfg-divider { height: 1px; background: #eef2f5; margin: 28px 0; }
.Calculator .sfg-calc-btn {
  width: 100%; padding: 16px; background: #ffd166; color: #07304b; font-weight: 800;
  font-size: 16px; border: none; border-radius: 10px; cursor: pointer; letter-spacing: 0.4px;
  transition: background .2s, transform .2s, box-shadow .2s; box-shadow: 0 6px 20px rgba(255,209,102,0.35);
}
.Calculator .sfg-calc-btn:hover {
  background: #f0c040; transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,209,102,0.45);
}
.Calculator .sfg-results { display: none; margin-top: 28px; }
.Calculator .sfg-results.active { display: block; }
.Calculator .sfg-result-cards { display: flex; gap: 16px; margin-bottom: 20px; }
.Calculator .sfg-result-card {
  flex: 1; background: linear-gradient(135deg, #07304b, #0d4a73); border-radius: 12px;
  padding: 24px 20px; text-align: center;
}
.Calculator .sfg-result-card .sfg-big {
  font-size: 36px; font-weight: 800; color: #ffd166; display: block; margin-bottom: 8px;
}
.Calculator .sfg-result-card .sfg-label { font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.4; }
.Calculator .sfg-result-text {
  background: #f7f9fb; border-left: 4px solid #ffd166; border-radius: 8px;
  padding: 20px 24px; font-size: 14px; color: #3a4a57; line-height: 1.75;
}
.Calculator .sfg-result-text strong { color: #07304b; }
@media (max-width: 600px) {
  .Calculator .sfg-field { flex-direction: column; align-items: stretch; }
  .Calculator .sfg-result-cards { flex-direction: column; }
}
</style>

<div class="Calculator">
<div class="sfg-calc-wrap">
  <div class="sfg-calc-header">
    <h2>Millionaire Calculator</h2>
    <p>Find out how long until your savings reach $1 million</p>
  </div>
  <div class="sfg-calc-body">

    <div class="sfg-field">
      <label>Initial investment (optional)</label>
      <div class="sfg-input-wrap">
        <span class="sfg-prefix">$</span>
        <input type="number" id="sfg-initial" value="20000" min="0">
      </div>
    </div>

    <div class="sfg-field">
      <label>Deposit amount</label>
      <div class="sfg-input-wrap">
        <select id="sfg-freq">
          <option value="12">Monthly</option>
          <option value="52">Weekly</option>
          <option value="26">Bi-weekly</option>
          <option value="1">Annually</option>
        </select>
        <span class="sfg-prefix">$</span>
        <input type="number" id="sfg-deposit" value="500" min="0">
      </div>
    </div>

    <div class="sfg-field">
      <label>Annual interest rate</label>
      <div class="sfg-input-wrap">
        <input type="number" id="sfg-rate" value="8" min="0" max="100" step="0.1">
        <span class="sfg-prefix">%</span>
      </div>
    </div>

    <div class="sfg-field">
      <label>Average annual inflation rate</label>
      <div class="sfg-input-wrap">
        <input type="number" id="sfg-inflation" value="3" min="0" max="20" step="0.1">
        <span class="sfg-prefix">%</span>
      </div>
    </div>

    <div class="sfg-field">
      <label>Target year to become a millionaire</label>
      <div class="sfg-input-wrap">
        <input type="number" id="sfg-target" value="2046" min="2025" max="2100">
        <span class="sfg-prefix">Yrs</span>
      </div>
    </div>

    <div class="sfg-divider"></div>

    <button class="sfg-calc-btn" onclick="sfgCalculate()">Calculate</button>

    <div class="sfg-results" id="sfg-results">
      <div class="sfg-result-cards">
        <div class="sfg-result-card">
          <span class="sfg-big" id="sfg-years">--</span>
          <span class="sfg-label">Years until your savings reaches $1 million</span>
        </div>
        <div class="sfg-result-card">
          <span class="sfg-big" id="sfg-worth">--</span>
          <span class="sfg-label">What $1 million will be worth in today's dollars</span>
        </div>
      </div>
      <div class="sfg-result-text" id="sfg-summary"></div>
    </div>

  </div>
</div>
</div>

<script>
function sfgCalculate() {
  var initial   = parseFloat(document.getElementById('sfg-initial').value)   || 0;
  var deposit   = parseFloat(document.getElementById('sfg-deposit').value)   || 0;
  var freq      = parseInt(document.getElementById('sfg-freq').value);
  var rate      = parseFloat(document.getElementById('sfg-rate').value)      / 100;
  var inflation = parseFloat(document.getElementById('sfg-inflation').value) / 100;
  var targetYr  = parseInt(document.getElementById('sfg-target').value);
  var currentYr = new Date().getFullYear();
  var goal      = 1000000;

  var rPer    = rate / freq;
  var balance = initial;
  var years   = 0;

  for (var i = 0; i < 200 * freq; i++) {
    balance = balance * (1 + rPer) + deposit;
    if ((i + 1) % freq === 0) {
      years++;
      if (balance >= goal) break;
    }
  }

  var reachYear = currentYr + years;
  var inflAdj   = goal / Math.pow(1 + inflation, years);

  document.getElementById('sfg-years').textContent = years;
  document.getElementById('sfg-worth').textContent = '$' + Math.round(inflAdj).toLocaleString();

  var summary = 'Based on your numbers, you will be a millionaire in <strong>' + years + ' years</strong> ' +
    '(' + reachYear + '). ' +
    'Your $1 million will be worth <strong>$' + Math.round(inflAdj).toLocaleString() + '</strong> ' +
    'in today\'s dollars after inflation. ';

  if (targetYr < reachYear) {
    var diff = reachYear - targetYr;
    summary += 'To hit your target of <strong>' + targetYr + '</strong>, you\'ll need to increase your deposits or starting amount — you\'re currently <strong>' + diff + ' years</strong> behind your goal.';
  } else {
    var ahead = targetYr - reachYear;
    summary += 'Great news — you\'re on track to hit your goal <strong>' + ahead + ' years early</strong>, by <strong>' + reachYear + '</strong>.';
  }

  document.getElementById('sfg-summary').innerHTML = summary;
  document.getElementById('sfg-results').classList.add('active');
}
</script>
