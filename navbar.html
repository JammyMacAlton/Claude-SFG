<style>
/* ================================================
   SFG Navigation Bar Stylesheet
   Colors: #07304b (Navy Blue) | #ffd166 (Gold)
   ================================================ */

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --navy: #07304b;
  --gold: #ffd166;
  --gold-dark: #e6b84a;
  --white: #ffffff;
  --text-muted: #5a6a75;
}

.sfg-topbar {
  background-color: var(--navy);
  color: var(--gold);
  text-align: center;
  font-size: 13px;
  font-family: 'Georgia', serif;
  letter-spacing: 0.08em;
  padding: 7px 20px;
  font-style: italic;
}

.sfg-navbar {
  background-color: var(--white);
  border-bottom: 3px solid var(--gold);
  box-shadow: 0 2px 16px rgba(7,48,75,0.10);
  position: sticky;
  top: 0;
  z-index: 1000;
  font-family: 'Georgia', 'Times New Roman', serif;
}

.sfg-navbar-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 30px;
}

.sfg-logo-wrap {
  display: flex;
  align-items: center;
  text-decoration: none;
  gap: 14px;
}

.sfg-logo-wrap img {
  height: 62px;
  width: auto;
  display: block;
}

.sfg-logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.sfg-logo-text .sfg-name {
  font-size: 20px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 0.03em;
}

.sfg-logo-text .sfg-tagline {
  font-size: 11px;
  color: var(--gold-dark);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-style: italic;
}

.sfg-nav-links {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sfg-nav-links li a {
  display: inline-block;
  text-decoration: none;
  color: var(--navy);
  font-size: 14.5px;
  font-family: 'Georgia', serif;
  letter-spacing: 0.04em;
  padding: 8px 14px;
  border-radius: 3px;
  position: relative;
  transition: color 0.25s ease, background-color 0.25s ease;
}

.sfg-nav-links li a::after {
  content: '';
  position: absolute;
  bottom: 4px;
  left: 14px;
  right: 14px;
  height: 2px;
  background-color: var(--gold);
  transform: scaleX(0);
  transform-origin: center;
  transition: transform 0.28s ease;
}

.sfg-nav-links li a:hover { background-color: rgba(255,209,102,0.10); }
.sfg-nav-links li a:hover::after { transform: scaleX(1); }

.sfg-nav-links li.sfg-refund a {
  color: var(--text-muted);
  font-size: 13.5px;
  border: 1px solid transparent;
}

.sfg-nav-links li.sfg-refund a:hover {
  color: var(--navy);
  border-color: var(--gold);
  background-color: rgba(255,209,102,0.08);
}

.sfg-nav-links li.sfg-cta a {
  background-color: var(--navy);
  color: var(--gold);
  border: 2px solid var(--navy);
  padding: 9px 20px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.06em;
  transition: background-color 0.25s, color 0.25s, border-color 0.25s;
}

.sfg-nav-links li.sfg-cta a::after { display: none; }

.sfg-nav-links li.sfg-cta a:hover {
  background-color: var(--gold);
  color: var(--navy);
  border-color: var(--gold);
}

.sfg-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 6px;
}

.sfg-hamburger span {
  display: block;
  width: 26px;
  height: 2px;
  background-color: var(--navy);
  border-radius: 2px;
  transition: all 0.3s ease;
}

.sfg-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.sfg-hamburger.open span:nth-child(2) { opacity: 0; }
.sfg-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

@media (max-width: 860px) {
  .sfg-hamburger { display: flex; }

  .sfg-nav-links {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background-color: var(--white);
    border-top: 3px solid var(--gold);
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, box-shadow 0.35s ease;
    box-shadow: none;
  }

  .sfg-nav-links.open {
    max-height: 420px;
    box-shadow: 0 8px 20px rgba(7,48,75,0.12);
  }

  .sfg-nav-links li a {
    display: block;
    padding: 14px 30px;
    border-bottom: 1px solid rgba(7,48,75,0.07);
    border-radius: 0;
    font-size: 15px;
  }

  .sfg-nav-links li a::after { display: none; }

  .sfg-nav-links li.sfg-cta {
    padding: 14px 20px;
  }

  .sfg-nav-links li.sfg-cta a {
    text-align: center;
    border-radius: 4px;
    margin: 0 10px;
    padding: 12px 20px;
  }
}

@media (max-width: 480px) {
  .sfg-navbar-inner { padding: 10px 16px; }
  .sfg-logo-wrap img { height: 50px; }
  .sfg-logo-text .sfg-name { font-size: 16px; }
  .sfg-topbar { font-size: 11px; }
}
</style>

<!-- ② Paste this HTML where you want the navbar to appear -->

<!-- Top Accent Bar -->
<div class="sfg-topbar">
  Trusted Tax &amp; Financial Services &nbsp;|&nbsp; Serving Clients Nationwide
</div>

<!-- Main Navigation -->
<nav class="sfg-navbar" role="navigation" aria-label="Main Navigation">
  <div class="sfg-navbar-inner">

    <!-- Logo -->
    <a href="https://sfgtaxservice.com/home-5735" class="sfg-logo-wrap" aria-label="Solution Financial Group Home">
      <!--
        Replace the src below with your actual uploaded logo URL.
        If your builder hosts images, upload the SFG logo and paste
        the URL here. Otherwise the text fallback below will show.
      -->
      <img
        src="https://sfgtaxservice.com/wp-content/uploads/SFG-logo.png"
        alt="Solution Financial Group Logo"
        onerror="this.style.display='none'"
      />
      <div class="sfg-logo-text">
        <span class="sfg-name">Solution Financial Group</span>
        <span class="sfg-tagline">Tax &amp; Financial Services</span>
      </div>
    </a>

    <!-- Hamburger (mobile) -->
    <button
      class="sfg-hamburger"
      id="sfgHamburger"
      aria-expanded="false"
      aria-controls="sfgNavLinks"
      aria-label="Toggle navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Nav Links -->
    <ul class="sfg-nav-links" id="sfgNavLinks" role="list">
      <li><a href="https://sfgtaxservice.com/home-5735">Home</a></li>
      <li><a href="https://sfgtaxservice.com/about-us">About Us</a></li>
      <li><a href="https://sfgtaxservice.com/services">Services</a></li>
      <li class="sfg-refund">
        <a href="https://www.irs.gov/wheres-my-refund" target="_blank" rel="noopener noreferrer">
          Track My Refund ↗
        </a>
      </li>
      <li class="sfg-cta">
        <a href="https://sfgtaxservice.com/new-client">New Client</a>
      </li>
    </ul>

  </div>
</nav>

<!-- ③ JavaScript — mobile menu toggle -->
<script>
  (function () {
    var hamburger = document.getElementById('sfgHamburger');
    var navLinks  = document.getElementById('sfgNavLinks');

    if (!hamburger || !navLinks) return;

    hamburger.addEventListener('click', function () {
      var isOpen = navLinks.classList.toggle('open');
      hamburger.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    // Close drawer when a link is clicked (single-page or anchor navigation)
    navLinks.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        navLinks.classList.remove('open');
        hamburger.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
      });
    });
  })();
</script>
