<style>
/* ================================================
   SFG Navigation Bar
   Colors: #07304b (Navy) | #ffd166 (Gold)
   ================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:      #07304b;
  --gold:      #ffd166;
  --gold-dark: #c99a2e;
  --white:     #ffffff;
}

.sfg-navbar {
  background-color: var(--white);
  border-bottom: 2px solid var(--gold);
  box-shadow: 0 1px 8px rgba(7,48,75,0.08);
  position: sticky;
  top: 0;
  z-index: 999;
  width: 100%;
}

.sfg-navbar-inner {
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  height: 72px;
}

/* Logo */
.sfg-logo {
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
}

.sfg-logo img {
  height: 52px;
  width: auto;
  display: block;
}

/* Nav links */
.sfg-nav {
  display: flex;
  align-items: center;
  list-style: none;
  gap: 2px;
  height: 100%;
}

.sfg-nav li {
  height: 100%;
  display: flex;
  align-items: center;
}

.sfg-nav li a {
  display: flex;
  align-items: center;
  height: 100%;
  text-decoration: none;
  color: var(--navy);
  font-family: 'Georgia', 'Times New Roman', serif;
  font-size: 14.5px;
  letter-spacing: 0.02em;
  padding: 0 16px;
  white-space: nowrap;
  position: relative;
  transition: color 0.2s ease;
}

.sfg-nav li a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 16px;
  right: 16px;
  height: 2px;
  background-color: var(--gold);
  transform: scaleX(0);
  transform-origin: center;
  transition: transform 0.25s ease;
}

.sfg-nav li a:hover { color: var(--gold-dark); }
.sfg-nav li a:hover::after { transform: scaleX(1); }

/* Divider */
.sfg-nav li.sfg-divider {
  width: 1px;
  height: 22px;
  background-color: #d0dce4;
  margin: 0 10px;
  flex-shrink: 0;
}

/* New Client CTA */
.sfg-nav li.sfg-cta a {
  background-color: var(--navy);
  color: var(--gold);
  border-radius: 3px;
  padding: 10px 20px;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  height: auto;
  margin-left: 8px;
  transition: background-color 0.22s, color 0.22s;
}
.sfg-nav li.sfg-cta a::after { display: none; }
.sfg-nav li.sfg-cta a:hover { background-color: var(--gold); color: var(--navy); }

/* Hamburger */
.sfg-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 8px;
}
.sfg-hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background-color: var(--navy);
  border-radius: 2px;
  transition: all 0.28s ease;
}
.sfg-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.sfg-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.sfg-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Mobile */
@media (max-width: 900px) {
  .sfg-navbar-inner { padding: 0 24px; height: 64px; }
  .sfg-hamburger { display: flex; }

  .sfg-nav {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background-color: var(--white);
    border-top: 2px solid var(--gold);
    border-bottom: 1px solid #e5eef3;
    flex-direction: column;
    align-items: stretch;
    height: auto;
    gap: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, box-shadow 0.35s ease;
  }

  .sfg-nav.open {
    max-height: 480px;
    box-shadow: 0 8px 24px rgba(7,48,75,0.10);
  }

  .sfg-nav li { height: auto; border-bottom: 1px solid #eef2f5; }
  .sfg-nav li.sfg-divider { display: none; }

  .sfg-nav li a {
    padding: 15px 28px;
    font-size: 15px;
    height: auto;
  }
  .sfg-nav li a::after { display: none; }

  .sfg-nav li.sfg-cta { padding: 14px 20px; border-bottom: none; }
  .sfg-nav li.sfg-cta a { display: block; text-align: center; margin-left: 0; padding: 13px 20px; width: 100%; }
}

@media (max-width: 480px) {
  .sfg-navbar-inner { padding: 0 16px; height: 58px; }
  .sfg-logo img { height: 42px; }
}
</style>

<!-- NAVBAR HTML -->
<nav class="sfg-navbar" role="navigation" aria-label="Main Navigation">
  <div class="sfg-navbar-inner">

    <!-- Logo -->
    <a href="https://sfgtaxservice.com/home-5735" class="sfg-logo" aria-label="Solution Financial Group — Home">
      <img
        src="https://assets.cdn.filesafe.space/frh1FySyXd0r7cSut9EW/media/6a36fa546a6dd1b69a5c5745.png"
        alt="Solution Financial Group"
      />
    </a>

    <!-- Mobile hamburger -->
    <button
      class="sfg-hamburger"
      id="sfgHamburger"
      aria-expanded="false"
      aria-controls="sfgNav"
      aria-label="Toggle menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation links -->
    <ul class="sfg-nav" id="sfgNav" role="list">
      <li><a href="https://sfgtaxservice.com/home-5735">Home</a></li>
      <li><a href="https://sfgtaxservice.com/about-us">About Us</a></li>
      <li><a href="https://sfgtaxservice.com/services">Services</a></li>
      <li>
        <a href="https://www.irs.gov/wheres-my-refund" target="_blank" rel="noopener noreferrer">
          Track My Refund
        </a>
      </li>
      <li class="sfg-divider" aria-hidden="true"></li>
      <li class="sfg-cta">
        <a href="https://sfgtaxservice.com/new-client">New Client</a>
      </li>
    </ul>

  </div>
</nav>

<script>
(function () {
  var btn = document.getElementById('sfgHamburger');
  var nav = document.getElementById('sfgNav');
  if (!btn || !nav) return;

  btn.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    btn.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open);
  });

  nav.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () {
      nav.classList.remove('open');
      btn.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>
