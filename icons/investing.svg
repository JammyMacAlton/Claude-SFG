<!-- Investing — geometric ascending staircase (compound growth / wealth building) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="step-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07304b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07304b" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <!-- baseline -->
  <line x1="8" y1="54" x2="56" y2="54" stroke="#07304b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- staircase steps -->
  <polyline points="8,54 8,42 18,42 18,30 30,30 30,20 44,20 44,10 56,10"
    stroke="#07304b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- step fills -->
  <rect x="8"  y="42" width="10" height="12" fill="url(#step-fill)"/>
  <rect x="18" y="30" width="12" height="24" fill="url(#step-fill)"/>
  <rect x="30" y="20" width="14" height="34" fill="url(#step-fill)"/>
  <rect x="44" y="10" width="12" height="44" fill="url(#step-fill)"/>
  <!-- gold accent line on top edges only -->
  <polyline points="8,42 18,42 18,30 30,30 30,20 44,20 44,10 56,10"
    stroke="#ffd166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- gold dot at top peak -->
  <circle cx="56" cy="10" r="3" fill="#ffd166"/>
</svg>
