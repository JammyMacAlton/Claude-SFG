<!-- Investing — candlestick chart (financial markets) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <line x1="10" y1="54" x2="54" y2="54" stroke="#07304b" stroke-width="2" stroke-linecap="round"/>
  <!-- candle 1 -->
  <line x1="18" y1="18" x2="18" y2="44" stroke="#07304b" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="14" y="26" width="8" height="14" rx="1" fill="#07304b"/>
  <!-- candle 2 — gold (up candle) -->
  <line x1="32" y1="14" x2="32" y2="40" stroke="#ffd166" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="28" y="20" width="8" height="14" rx="1" fill="#ffd166"/>
  <!-- candle 3 -->
  <line x1="46" y1="16" x2="46" y2="38" stroke="#07304b" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="42" y="20" width="8" height="12" rx="1" fill="#07304b"/>
</svg>
