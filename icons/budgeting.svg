<!-- Budgeting — precision balance scale, classic financial symbol -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- base and pole -->
  <rect x="22" y="56" width="20" height="3" rx="1.5" fill="#07304b"/>
  <line x1="32" y1="56" x2="32" y2="16" stroke="#07304b" stroke-width="2" stroke-linecap="round"/>
  <!-- balance beam -->
  <line x1="10" y1="22" x2="54" y2="22" stroke="#07304b" stroke-width="2" stroke-linecap="round"/>
  <!-- fulcrum dot -->
  <circle cx="32" cy="16" r="2.5" fill="#ffd166" stroke="#07304b" stroke-width="1.5"/>
  <!-- left pan chain -->
  <line x1="16" y1="22" x2="13" y2="32" stroke="#07304b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="19" y2="32" stroke="#07304b" stroke-width="1.2" stroke-linecap="round"/>
  <!-- left pan (slightly higher — balanced) -->
  <path d="M10,32 Q16,36 22,32" stroke="#07304b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- right pan chain -->
  <line x1="48" y1="22" x2="45" y2="34" stroke="#07304b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="48" y1="22" x2="51" y2="34" stroke="#07304b" stroke-width="1.2" stroke-linecap="round"/>
  <!-- right pan (slightly lower) -->
  <path d="M42,36 Q48,40 54,36" stroke="#07304b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- gold coins on right pan -->
  <ellipse cx="48" cy="36" rx="4.5" ry="1.5" fill="#ffd166" opacity="0.9"/>
  <ellipse cx="48" cy="34.5" rx="4.5" ry="1.5" fill="#ffd166"/>
</svg>
