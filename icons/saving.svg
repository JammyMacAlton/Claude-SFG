<!-- Saving — classic old-school money bag with drawstring and dollar sign -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- bag body — full round sack -->
  <path d="M32 56 C18 56 10 48 10 38 C10 28 16 22 22 20 C20 18 18 14 20 12 C22 10 28 10 32 10 C36 10 42 10 44 12 C46 14 44 18 42 20 C48 22 54 28 54 38 C54 48 46 56 32 56 Z"
    fill="#07304b" opacity="0.08" stroke="#07304b" stroke-width="2" stroke-linejoin="round"/>
  <!-- cinch line -->
  <path d="M22 20 Q32 24 42 20" stroke="#07304b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- drawstring bow -->
  <path d="M28 14 C26 11 22 11 22 13 C22 15 26 15 28 14 Z" fill="#ffd166" stroke="#ffd166" stroke-width="0.5"/>
  <path d="M36 14 C38 11 42 11 42 13 C42 15 38 15 36 14 Z" fill="#ffd166" stroke="#ffd166" stroke-width="0.5"/>
  <circle cx="32" cy="14" r="2.5" fill="#ffd166"/>
  <!-- dollar sign on bag -->
  <line x1="32" y1="28" x2="32" y2="50" stroke="#07304b" stroke-width="2" stroke-linecap="round"/>
  <path d="M27 32 H36 a4 4 0 0 1 0 8 H28 a4 4 0 0 0 0 8 H37" stroke="#07304b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- gold shine highlight -->
  <path d="M16 32 Q14 38 16 44" stroke="#ffd166" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
