<!-- Saving — architectural bank vault, precision dial with tick marks -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="vault-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07304b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07304b" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- vault body -->
  <rect x="6" y="8" width="52" height="48" rx="4" fill="url(#vault-bg)" stroke="#07304b" stroke-width="2"/>
  <!-- inner inset -->
  <rect x="10" y="12" width="44" height="40" rx="2.5" stroke="#07304b" stroke-width="1" opacity="0.3"/>
  <!-- dial ring -->
  <circle cx="30" cy="32" r="14" stroke="#07304b" stroke-width="2"/>
  <circle cx="30" cy="32" r="10" stroke="#07304b" stroke-width="1" opacity="0.25"/>
  <!-- dial tick marks at 12 positions -->
  <line x1="30" y1="19" x2="30" y2="21.5" stroke="#07304b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="42.5" x2="30" y2="45" stroke="#07304b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="32" x2="19.5" y2="32" stroke="#07304b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40.5" y1="32" x2="43" y2="32" stroke="#07304b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20.8" y1="22.8" x2="22.5" y2="24.5" stroke="#07304b" stroke-width="1" stroke-linecap="round"/>
  <line x1="37.5" y1="39.5" x2="39.2" y2="41.2" stroke="#07304b" stroke-width="1" stroke-linecap="round"/>
  <line x1="20.8" y1="41.2" x2="22.5" y2="39.5" stroke="#07304b" stroke-width="1" stroke-linecap="round"/>
  <line x1="37.5" y1="24.5" x2="39.2" y2="22.8" stroke="#07304b" stroke-width="1" stroke-linecap="round"/>
  <!-- dial pointer in gold -->
  <line x1="30" y1="32" x2="38" y2="25" stroke="#ffd166" stroke-width="2.2" stroke-linecap="round"/>
  <!-- center hub -->
  <circle cx="30" cy="32" r="2.5" fill="#ffd166" stroke="#07304b" stroke-width="1"/>
  <!-- door handle -->
  <line x1="50" y1="28" x2="50" y2="36" stroke="#07304b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="28" r="1.5" fill="#07304b"/>
  <circle cx="50" cy="36" r="1.5" fill="#07304b"/>
</svg>
